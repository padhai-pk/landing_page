    <script>
      // Set the theme before React mounts so there's no flash of the wrong
      // theme. Defaults to LIGHT unless the person previously chose dark.
      (function () {
        try {
          var saved = localStorage.getItem('padhai-theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
